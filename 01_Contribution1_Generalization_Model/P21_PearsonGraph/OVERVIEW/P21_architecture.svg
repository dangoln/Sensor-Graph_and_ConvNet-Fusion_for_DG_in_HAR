<svg viewBox="0 0 1280 1640" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrowRev" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c026d3"/>
    </marker>
  </defs>

  <style>
    .title    { font-size: 28px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-size: 14px; fill: #475569; }
    .phase    { font-size: 15px; font-weight: 700; fill: #1e293b; }
    .box      { font-size: 13px; fill: #0f172a; }
    .small    { font-size: 11.5px; fill: #475569; }
    .tag      { font-size: 11px; font-weight: 700; fill: #ffffff; }
    .edge     { stroke: #475569; stroke-width: 2; fill: none; }
    .edgeRev  { stroke: #c026d3; stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
    .frozen   { font-size: 11px; font-weight: 700; fill: #b45309; }
  </style>

  <!-- ===== Header ===== -->
  <text x="40" y="48" class="title">P21 — Pearson-Graph HAR (LODO Domain Generalization)</text>
  <text x="40" y="72" class="subtitle">Per-window Pearson-correlation graph construction · GraphSAGE + DANN-over-sources · late fusion with a frozen ConvNet branch</text>

  <!-- ===== Phase 1: Data ===== -->
  <rect x="40" y="96" width="1200" height="118" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <rect x="40" y="96" width="150" height="118" rx="10" fill="#0ea5e9"/>
  <text x="115" y="150" class="tag" text-anchor="middle">PHASE 1</text>
  <text x="115" y="170" class="tag" text-anchor="middle">DATA</text>

  <rect x="210" y="118" width="300" height="74" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="360" y="142" class="box" text-anchor="middle" font-weight="700">Load DAGHAR (6 datasets)</text>
  <text x="360" y="162" class="small" text-anchor="middle">KuHar · MotionSense · RW-Thigh · RW-Waist</text>
  <text x="360" y="178" class="small" text-anchor="middle">UCI · WISDM   |   window [60 steps × 6 ch]</text>

  <rect x="540" y="118" width="320" height="74" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="700" y="142" class="box" text-anchor="middle" font-weight="700">LODO split (leave-one-dataset-out)</text>
  <text x="700" y="162" class="small" text-anchor="middle">5 sources → train / val   ·   1 target → test</text>
  <text x="700" y="178" class="small" text-anchor="middle">Pure DG: NO target data loaded at all</text>

  <rect x="890" y="118" width="330" height="74" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="1055" y="138" class="box" text-anchor="middle" font-weight="700">Node features = HYBRID (90-dim/node)</text>
  <text x="1055" y="157" class="small" text-anchor="middle">raw time (60) ⊕ FFT-mag (30, DC dropped)</text>
  <text x="1055" y="174" class="small" text-anchor="middle">per-channel z-norm (source-train stats only)</text>

  <line x1="510" y1="155" x2="538" y2="155" class="edge" marker-end="url(#arrow)"/>
  <line x1="860" y1="155" x2="888" y2="155" class="edge" marker-end="url(#arrow)"/>
  <line x1="640" y1="214" x2="640" y2="250" class="edge" marker-end="url(#arrow)"/>

  <!-- ===== Phase 2 banner ===== -->
  <rect x="40" y="250" width="1200" height="34" rx="8" fill="#1e293b"/>
  <text x="60" y="272" class="tag" font-size="13">PHASE 2 — TWO BRANCHES (only the GNN branch is trained in P21)</text>

  <!-- ================= GNN BRANCH ================= -->
  <rect x="40" y="300" width="740" height="1000" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="60" y="328" class="phase" fill="#4338ca">GNN BRANCH  (trained — the P21 novelty lives here)</text>

  <!-- Raw window node -->
  <rect x="300" y="344" width="220" height="44" rx="8" fill="#ffffff" stroke="#6366f1"/>
  <text x="410" y="364" class="box" text-anchor="middle" font-weight="700">Raw window [60 × 6]</text>
  <text x="410" y="380" class="small" text-anchor="middle">feeds BOTH sub-paths below</text>

  <!-- split lines -->
  <path d="M360,388 L360,410 L180,410 L180,432" class="edge" marker-end="url(#arrow)"/>
  <path d="M460,388 L460,410 L620,410 L620,432" class="edge" marker-end="url(#arrow)"/>

  <!-- LEFT sub-path: node encoder -->
  <rect x="62" y="432" width="360" height="360" rx="10" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="242" y="456" class="phase" text-anchor="middle" fill="#4338ca">Node signal → embedding</text>
  <text x="242" y="474" class="small" text-anchor="middle">CNN1DEncoder · per-modality (accel / gyro)</text>

  <rect x="92" y="488" width="300" height="30" rx="6" fill="#e0e7ff" stroke="#a5b4fc"/>
  <text x="242" y="508" class="box" text-anchor="middle">input [nodes, 90] → unsqueeze → [nodes,1,90]</text>

  <rect x="92" y="524" width="300" height="30" rx="6" fill="#e0e7ff" stroke="#a5b4fc"/>
  <text x="242" y="544" class="box" text-anchor="middle">Conv1d(1→32, k5, pad2) · BN(32) · ReLU</text>

  <rect x="92" y="560" width="300" height="30" rx="6" fill="#e0e7ff" stroke="#a5b4fc"/>
  <text x="242" y="580" class="box" text-anchor="middle">Conv1d(32→64, k5, pad2) · BN(64) · ReLU</text>

  <rect x="92" y="596" width="300" height="30" rx="6" fill="#e0e7ff" stroke="#a5b4fc"/>
  <text x="242" y="616" class="box" text-anchor="middle">AdaptiveAvgPool1d(1) → [nodes, 64]</text>

  <rect x="92" y="632" width="300" height="30" rx="6" fill="#e0e7ff" stroke="#a5b4fc"/>
  <text x="242" y="652" class="box" text-anchor="middle">Linear(64 → 64)</text>

  <rect x="92" y="676" width="300" height="44" rx="6" fill="#c7d2fe" stroke="#6366f1"/>
  <text x="242" y="695" class="box" text-anchor="middle" font-weight="700">Node embeddings [6, 64]</text>
  <text x="242" y="711" class="small" text-anchor="middle">+ edge_type embed (×0.1) added to src nodes</text>

  <line x1="242" y1="518" x2="242" y2="524" class="edge" marker-end="url(#arrow)"/>
  <line x1="242" y1="554" x2="242" y2="560" class="edge" marker-end="url(#arrow)"/>
  <line x1="242" y1="590" x2="242" y2="596" class="edge" marker-end="url(#arrow)"/>
  <line x1="242" y1="626" x2="242" y2="632" class="edge" marker-end="url(#arrow)"/>
  <line x1="242" y1="662" x2="242" y2="676" class="edge" marker-end="url(#arrow)"/>

  <!-- RIGHT sub-path: pearson graph -->
  <rect x="440" y="432" width="320" height="360" rx="10" fill="#ffffff" stroke="#f59e0b"/>
  <text x="600" y="456" class="phase" text-anchor="middle" fill="#b45309">Pearson graph construction</text>
  <text x="600" y="474" class="small" text-anchor="middle">★ the ONE P21 lever (data/pearson.py)</text>

  <rect x="462" y="488" width="276" height="44" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="600" y="508" class="box" text-anchor="middle">|Pearson ρ| on RAW 60-step signal</text>
  <text x="600" y="524" class="small" text-anchor="middle">6 channels → 15 candidate pairs</text>

  <rect x="462" y="544" width="276" height="44" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="600" y="564" class="box" text-anchor="middle">score = α·|ρ| + (1−α)·physical_prior</text>
  <text x="600" y="580" class="small" text-anchor="middle">winning config: top-k=9, α=1.0</text>

  <rect x="462" y="600" width="276" height="44" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="600" y="620" class="box" text-anchor="middle">keep top-k pairs → bidirectional</text>
  <text x="600" y="636" class="small" text-anchor="middle">edge_type ∈ {intra-acc, intra-gyr, cross}</text>

  <rect x="462" y="676" width="276" height="44" rx="6" fill="#fde68a" stroke="#d97706"/>
  <text x="600" y="695" class="box" text-anchor="middle" font-weight="700">Per-window edge_index</text>
  <text x="600" y="711" class="small" text-anchor="middle">own signal only → zero leakage</text>

  <line x1="600" y1="532" x2="600" y2="544" class="edge" marker-end="url(#arrow)"/>
  <line x1="600" y1="588" x2="600" y2="600" class="edge" marker-end="url(#arrow)"/>
  <line x1="600" y1="644" x2="600" y2="676" class="edge" marker-end="url(#arrow)"/>

  <!-- merge into GraphSAGE -->
  <path d="M242,720 L242,820 L380,820" class="edge"/>
  <path d="M600,720 L600,820 L460,820" class="edge"/>

  <rect x="230" y="828" width="360" height="78" rx="10" fill="#c7d2fe" stroke="#4338ca" stroke-width="2"/>
  <text x="410" y="852" class="box" text-anchor="middle" font-weight="700">GraphSAGE message passing (×2)</text>
  <text x="410" y="872" class="small" text-anchor="middle">per layer:  Dropout(0.2) → SAGEConv(64→64)</text>
  <text x="410" y="888" class="small" text-anchor="middle">→ BatchNorm(64) → ReLU   (edge weights ignored)</text>
  <line x1="410" y1="820" x2="410" y2="828" class="edge" marker-end="url(#arrow)"/>

  <rect x="280" y="934" width="260" height="44" rx="10" fill="#ffffff" stroke="#6366f1"/>
  <text x="410" y="954" class="box" text-anchor="middle" font-weight="700">global_mean_pool</text>
  <text x="410" y="970" class="small" text-anchor="middle">graph embedding h [batch, 64]</text>
  <line x1="410" y1="906" x2="410" y2="934" class="edge" marker-end="url(#arrow)"/>

  <!-- two heads -->
  <path d="M360,978 L360,1008 L250,1008 L250,1036" class="edge" marker-end="url(#arrow)"/>
  <path d="M460,978 L460,1008 L585,1008 L585,1036" class="edgeRev" marker-end="url(#arrowRev)"/>

  <rect x="92" y="1036" width="316" height="66" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="250" y="1060" class="box" text-anchor="middle" font-weight="700">Activity head</text>
  <text x="250" y="1080" class="small" text-anchor="middle">Linear(64 → 6) → softmax</text>
  <text x="250" y="1096" class="small" text-anchor="middle">CrossEntropy(activity)</text>

  <rect x="430" y="1036" width="320" height="120" rx="10" fill="#fae8ff" stroke="#c026d3"/>
  <text x="590" y="1058" class="box" text-anchor="middle" font-weight="700">Domain head (DANN-over-sources)</text>
  <text x="590" y="1078" class="small" text-anchor="middle">GRL(λ) — reverses gradient</text>
  <text x="590" y="1095" class="small" text-anchor="middle">Linear(64→64) → ReLU → Dropout(0.2)</text>
  <text x="590" y="1112" class="small" text-anchor="middle">Linear(64 → 5 source domains)</text>
  <text x="590" y="1133" class="small" text-anchor="middle">CrossEntropy(domain) · λ Ganin 0→1</text>

  <!-- GRL feedback arrow back to encoder -->
  <path d="M750,1096 L772,1096 L772,762 L424,762" class="edgeRev" marker-end="url(#arrowRev)"/>
  <text x="784" y="930" class="frozen" transform="rotate(90 784 930)" fill="#c026d3">reversed gradient → domain-invariant features</text>

  <!-- loss box -->
  <rect x="150" y="1180" width="480" height="44" rx="8" fill="#1e293b"/>
  <text x="390" y="1200" class="tag" text-anchor="middle" font-size="13">Total loss  =  CE(activity)  +  λ · CE(domain)</text>
  <text x="390" y="1216" class="small" text-anchor="middle" fill="#cbd5e1">Adam 1e-3 · wd 5e-4 · cosine→1e-5 · clip 1.0 · early-stop p20 · bs64</text>
  <path d="M250,1102 L250,1160 L350,1160 L350,1180" class="edge" marker-end="url(#arrow)"/>
  <path d="M590,1156 L590,1160 L430,1160 L430,1180" class="edge" marker-end="url(#arrow)"/>

  <!-- GNN probs out -->
  <rect x="250" y="1244" width="320" height="44" rx="8" fill="#16a34a"/>
  <text x="410" y="1264" class="tag" text-anchor="middle" font-size="13">GNN probs  P_gnn  [N, 6]</text>
  <text x="410" y="1281" class="small" text-anchor="middle" fill="#dcfce7">softmax on target-test, in CSV order</text>
  <line x1="390" y1="1224" x2="400" y2="1244" class="edge" marker-end="url(#arrow)"/>

  <!-- ================= CONVNET BRANCH (frozen DeepConvLSTM) ================= -->
  <rect x="804" y="300" width="436" height="1000" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="824" y="328" class="phase" fill="#b45309">ConvNet branch — DeepConvLSTM</text>
  <text x="824" y="347" class="frozen">❄ FROZEN — trained in P18b, reused in P21</text>
  <text x="824" y="363" class="small">Ordóñez &amp; Roggen 2016 · defined in P18b</text>

  <!-- Input -->
  <rect x="872" y="376" width="300" height="46" rx="8" fill="#ffffff" stroke="#fb923c"/>
  <text x="1022" y="396" class="box" text-anchor="middle" font-weight="700">Input: frequency view  (B, 1, 31, 6)</text>
  <text x="1022" y="413" class="small" text-anchor="middle">log-mag FFT · 31 bins (DC kept) · 6 ch · z-score</text>

  <!-- Conv stack -->
  <rect x="872" y="436" width="300" height="58" rx="8" fill="#ffedd5" stroke="#fb923c"/>
  <text x="1022" y="457" class="box" text-anchor="middle" font-weight="700">4 × Conv2d(64, kernel (5,1)) + ReLU</text>
  <text x="1022" y="474" class="small" text-anchor="middle">valid pad · conv over TIME only (ch kept separate)</text>
  <text x="1022" y="489" class="small" text-anchor="middle">time 31 → 15  →  (B, 64, 15, 6)</text>

  <!-- permute + flatten -->
  <rect x="872" y="508" width="300" height="44" rx="8" fill="#ffedd5" stroke="#fb923c"/>
  <text x="1022" y="528" class="box" text-anchor="middle">permute (0,2,1,3) + flatten 64·6</text>
  <text x="1022" y="544" class="small" text-anchor="middle">→ (B, 15, 384) per-timestep features</text>

  <!-- dropout -->
  <rect x="922" y="566" width="200" height="28" rx="6" fill="#fde68a" stroke="#d97706"/>
  <text x="1022" y="585" class="box" text-anchor="middle">Dropout(p=0.5)</text>

  <!-- LSTM 1 -->
  <rect x="872" y="606" width="300" height="32" rx="8" fill="#ffedd5" stroke="#fb923c"/>
  <text x="1022" y="627" class="box" text-anchor="middle">LSTM(384 → 128)   layer 1</text>

  <!-- LSTM 2 -->
  <rect x="872" y="648" width="300" height="44" rx="8" fill="#ffedd5" stroke="#fb923c"/>
  <text x="1022" y="668" class="box" text-anchor="middle">LSTM(128 → 128)   layer 2</text>
  <text x="1022" y="684" class="small" text-anchor="middle">inter-layer dropout 0.5  →  (B, 15, 128)</text>

  <!-- last timestep -->
  <rect x="872" y="706" width="300" height="32" rx="8" fill="#ffedd5" stroke="#fb923c"/>
  <text x="1022" y="727" class="box" text-anchor="middle">SliceLayer(−1): last timestep → (B, 128)</text>

  <!-- dropout -->
  <rect x="922" y="752" width="200" height="28" rx="6" fill="#fde68a" stroke="#d97706"/>
  <text x="1022" y="771" class="box" text-anchor="middle">Dropout(p=0.5)</text>

  <!-- classifier -->
  <rect x="872" y="792" width="300" height="32" rx="8" fill="#ffffff" stroke="#fb923c"/>
  <text x="1022" y="813" class="box" text-anchor="middle" font-weight="700">Linear(128 → 6) → softmax</text>

  <!-- arrows down the stack -->
  <line x1="1022" y1="422" x2="1022" y2="436" class="edge" marker-end="url(#arrow)"/>
  <line x1="1022" y1="494" x2="1022" y2="508" class="edge" marker-end="url(#arrow)"/>
  <line x1="1022" y1="552" x2="1022" y2="566" class="edge" marker-end="url(#arrow)"/>
  <line x1="1022" y1="594" x2="1022" y2="606" class="edge" marker-end="url(#arrow)"/>
  <line x1="1022" y1="638" x2="1022" y2="648" class="edge" marker-end="url(#arrow)"/>
  <line x1="1022" y1="692" x2="1022" y2="706" class="edge" marker-end="url(#arrow)"/>
  <line x1="1022" y1="738" x2="1022" y2="752" class="edge" marker-end="url(#arrow)"/>
  <line x1="1022" y1="780" x2="1022" y2="792" class="edge" marker-end="url(#arrow)"/>

  <!-- probs out -->
  <rect x="884" y="846" width="276" height="46" rx="8" fill="#fb923c"/>
  <text x="1022" y="867" class="tag" text-anchor="middle" font-size="13">ConvNet probs  P_conv  [N, 6]</text>
  <text x="1022" y="884" class="small" text-anchor="middle" fill="#7c2d12">copied frozen: convnet_&lt;target&gt;.npz</text>
  <line x1="1022" y1="824" x2="1022" y2="846" class="edge" marker-end="url(#arrow)"/>

  <!-- training note -->
  <rect x="844" y="912" width="356" height="78" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="1022" y="932" class="small" text-anchor="middle" font-weight="700">Trained in P18b (frozen for P21):</text>
  <text x="1022" y="950" class="small" text-anchor="middle">RMSProp · lr 1e-3 · bs 100 · orthogonal init</text>
  <text x="1022" y="966" class="small" text-anchor="middle">dropout 0.5 on every dense input · early-stop p20</text>
  <text x="1022" y="982" class="small" text-anchor="middle">P21 changes ONLY the GNN graph — this is untouched</text>

  <!-- ================= Phase 3: Fusion ================= -->
  <rect x="40" y="1340" width="1200" height="150" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <rect x="40" y="1340" width="150" height="150" rx="12" fill="#0d9488"/>
  <text x="115" y="1408" class="tag" text-anchor="middle">PHASE 3</text>
  <text x="115" y="1428" class="tag" text-anchor="middle">FUSION</text>

  <rect x="320" y="1372" width="380" height="86" rx="10" fill="#ffffff" stroke="#0d9488"/>
  <text x="510" y="1398" class="box" text-anchor="middle" font-weight="700">Late fusion (weighted prob average)</text>
  <text x="510" y="1420" class="box" text-anchor="middle">P = w · P_gnn + (1 − w) · P_conv</text>
  <text x="510" y="1440" class="small" text-anchor="middle">w swept ∈ {0, 0.3, 0.4, 0.5, 0.6, 0.7, 1.0}</text>

  <rect x="760" y="1372" width="420" height="86" rx="10" fill="#ccfbf1" stroke="#0d9488"/>
  <text x="970" y="1398" class="box" text-anchor="middle" font-weight="700">Activity classification (argmax)</text>
  <text x="970" y="1420" class="small" text-anchor="middle">6 classes: sit · stand · walk · stair-up · stair-down · run</text>
  <text x="970" y="1440" class="small" text-anchor="middle">seed-averaged report + KEEP/REVERT gate</text>

  <line x1="700" y1="1415" x2="758" y2="1415" class="edge" marker-end="url(#arrow)"/>

  <!-- feeds into fusion -->
  <path d="M410,1288 L410,1320 L470,1320 L470,1372" class="edge" marker-end="url(#arrow)"/>
  <path d="M1022,892 L1022,1338 L640,1338 L640,1372" class="edge" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="40" y="1520" width="1200" height="96" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="60" y="1546" class="phase">Legend</text>
  <rect x="60" y="1560" width="22" height="14" rx="3" fill="#c7d2fe" stroke="#4338ca"/>
  <text x="92" y="1572" class="small">trained GNN backbone</text>
  <rect x="270" y="1560" width="22" height="14" rx="3" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="302" y="1572" class="small">P21 Pearson graph (the one lever)</text>
  <rect x="560" y="1560" width="22" height="14" rx="3" fill="#fff7ed" stroke="#fb923c" stroke-dasharray="4 3"/>
  <text x="592" y="1572" class="small">frozen / reused</text>
  <line x1="760" y1="1567" x2="800" y2="1567" class="edgeRev"/>
  <text x="810" y="1572" class="small">reversed gradient (GRL)</text>
  <rect x="60" y="1586" width="22" height="14" rx="3" fill="#dcfce7" stroke="#16a34a"/>
  <text x="92" y="1598" class="small">activity head / outputs</text>
  <rect x="270" y="1586" width="22" height="14" rx="3" fill="#fae8ff" stroke="#c026d3"/>
  <text x="302" y="1598" class="small">domain-adversarial head (5 source domains)</text>
  <text x="560" y="1598" class="small">Reference: P18b base = 76.87 ± 1.07% · oracle headroom ~85%</text>
</svg>
